<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masglobal | Omni-Pitch Strategic Matrix v2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --gold: #D4AF37; --asphalt: #0F172A; }
        body { background-color: var(--asphalt); color: white; font-family: 'Cairo', sans-serif; overflow: hidden; }
        .cinema-mode { position: fixed; inset: 0; z-index: 100; background: black; }
        .dashboard-ui { display: grid; grid-template-columns: 300px 1fr 350px; height: 100vh; transition: grid-template-columns 0.4s ease; }
        .dashboard-ui.dashboard-collapsed { grid-template-columns: 300px 1fr 0px; }
        .slide-content-container { transition: opacity 0.5s ease-in-out; }
        .progress-track { height: 3px; background: rgba(212,175,55,0.15); }
        .progress-fill { height: 3px; background: var(--gold); transition: width 0.4s ease; }
        .nav-btn { width: 2.75rem; height: 2.75rem; border-radius: 9999px; border: 1px solid rgba(212,175,55,0.4); display: flex; align-items: center; justify-content: center; transition: all 0.2s ease; }
        .nav-btn:hover { background: rgba(212,175,55,0.15); transform: scale(1.05); }
        .sidebar-item.active { background: rgba(212,175,55,0.15); border-right: 3px solid var(--gold); color: var(--gold); }
        .kpi-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(212,175,55,0.15); border-radius: 0.75rem; padding: 1rem; }
        @media print {
            .no-print { display: none !important; }
            body { overflow: visible; }
        }
    </style>
</head>
<body>

<!-- Omni-Matrix Controller -->
<div id="root" class="dashboard-ui">
    <!-- 1. Navigation Sidebar -->
    <aside id="sidebar" class="bg-slate-950 border-r border-gold/20 p-4 overflow-y-auto no-print">
        <h2 class="text-gold font-black text-xl mb-2">MASGLOBAL MATRIX</h2>
        <p class="text-[11px] text-slate-500 mb-6">Omni-Pitch Strategic Engine · v2026</p>
        <div id="slide-list" class="space-y-2"></div>
    </aside>

    <!-- 2. Central Presentation Engine -->
    <main class="flex flex-col h-full bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-slate-900 to-black">
        <header class="no-print">
            <div class="progress-track w-full">
                <div id="progress-fill" class="progress-fill" style="width:0%"></div>
            </div>
            <div class="p-4 flex justify-between items-center border-b border-white/10">
                <div id="status-badge" class="text-[10px] text-green-500 animate-pulse">● SYSTEM ONLINE: INTEGRITY 100%</div>
                <div id="slide-counter" class="text-xs text-slate-400 font-mono"></div>
                <div class="space-x-4 space-x-reverse">
                    <button onclick="MatrixEngine.toggleCinema()" class="text-gold hover:text-white transition">🎥 CINEMA</button>
                    <button onclick="MatrixEngine.toggleDashboard()" class="text-gold hover:text-white transition">📊 DASHBOARD</button>
                    <button onclick="window.print()" class="text-gold hover:text-white transition">🖨️ EXPORT</button>
                </div>
            </div>
        </header>
        <section id="viewport" class="flex-1 flex items-center justify-center p-10 gap-6">
            <button onclick="MatrixEngine.prevSlide()" class="nav-btn no-print" aria-label="السابق">←</button>
            <div id="slide-canvas" class="slide-content-container w-full max-w-5xl aspect-video glass rounded-2xl border border-gold/30 shadow-[0_0_50px_rgba(212,175,55,0.1)] p-12 overflow-y-auto">
                <!-- Data Injection Point -->
            </div>
            <button onclick="MatrixEngine.nextSlide()" class="nav-btn no-print" aria-label="التالي">→</button>
        </section>
    </main>

    <!-- 3. Expert Dashboard (Teleprompter + Live KPIs) -->
    <aside id="expert-panel" class="bg-slate-950 border-l border-gold/20 p-6 overflow-y-auto no-print">
        <h3 class="text-gold font-bold mb-4">EXPERT INSIGHTS</h3>
        <div id="teleprompter" class="text-sm text-slate-300 leading-relaxed italic mb-6"></div>
        <h3 class="text-gold font-bold mb-3 text-sm">LIVE KPI SNAPSHOT</h3>
        <div id="kpi-grid" class="grid grid-cols-2 gap-3"></div>
    </aside>
</div>

<script>
/** 
 * SOVEREIGN SYMMETRY GUARD - VER 2026
 * Integrity check for data nodes before rendering.
 */
const SovereignSymmetryGuard = {
    validate: (data) => {
        const hash = btoa(JSON.stringify(data).length.toString());
        console.log(`[SovereignGuard] Node Integrity Verified: ${hash}`);
        return true;
    }
};

/**
 * MATRIX ENGINE
 */
const MatrixEngine = {
    currentSlide: 0,
    dashboardCollapsed: false,
    slides: [
        {
            title: "الخطة الاستراتيجية",
            body: "تحويل البنية الفيزيائية إلى أصول رقمية عبر منصة موحدة تدير العمليات والاستثمار والتوسع.",
            note: "التركيز على خفض التكلفة الرأسمالية وتسريع زمن الوصول للسوق.",
            kpis: [["CAPEX ↓", "32%"], ["Time to Market", "4 أشهر"]]
        },
        {
            title: "هندسة الأرباح",
            body: "توزيع الدخل المباشر من مشاريع البنية التحتية عبر نماذج تشغيل متعددة الطبقات.",
            note: "رفع كفاءة التدفق النقدي وتقليل الاعتماد على مصدر دخل واحد.",
            kpis: [["Gross Margin", "41%"], ["Revenue Streams", "5"]]
        },
        {
            title: "فرصة السوق",
            body: "سوق إقليمي يتجاوز 2.4 مليار دولار سنوياً مع نمو مركب 18% في القطاعات المستهدفة.",
            note: "التموضع المبكر يمنح ميزة تفاوضية في الشراكات الاستراتيجية.",
            kpis: [["TAM", "$2.4B"], ["CAGR", "18%"]]
        },
        {
            title: "النموذج المالي",
            body: "تعادل تشغيلي متوقع خلال 14 شهراً، مع نقطة ربحية صافية في الربع الثالث من السنة الثانية.",
            note: "التحفظ في الافتراضات يحمي التقديرات من تقلبات السوق.",
            kpis: [["Breakeven", "Q3 / Y2"], ["IRR", "27%"]]
        },
        {
            title: "خارطة الطريق",
            body: "ثلاث مراحل: التأسيس والتحقق، التوسع الإقليمي، ثم الهيمنة على القطاع عبر الاستحواذات الصغيرة.",
            note: "كل مرحلة مرتبطة بمؤشرات قابلة للقياس قبل الانتقال للتالية.",
            kpis: [["Phase 1", "0-6m"], ["Phase 3", "18m+"]]
        },
        {
            title: "الدعوة للعمل",
            body: "نطلب جولة تمويل لتسريع التوسع وتثبيت الحصة السوقية قبل دخول منافسين جدد.",
            note: "نافذة الفرصة الحالية محدودة بمدة 9-12 شهراً.",
            kpis: [["Ask", "$3.5M"], ["Use of Funds", "Growth"]]
        }
    ],

    init() {
        this.renderList();
        this.loadSlide(0);
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') this.nextSlide();
            if (e.key === 'ArrowRight') this.prevSlide();
        });
    },

    renderList() {
        const list = document.getElementById('slide-list');
        list.innerHTML = '';
        this.slides.forEach((s, i) => {
            list.innerHTML += `<button data-index="${i}" onclick="MatrixEngine.loadSlide(${i})" class="sidebar-item w-full text-right p-3 hover:bg-gold/10 rounded transition">${s.title}</button>`;
        });
    },

    loadSlide(i) {
        if (i < 0 || i >= this.slides.length) return;
        if (!SovereignSymmetryGuard.validate(this.slides[i])) return;
        this.currentSlide = i;
        const s = this.slides[i];

        document.getElementById('slide-canvas').innerHTML = `<h1 class="text-4xl font-bold mb-6">${s.title}</h1><p class="text-xl leading-relaxed">${s.body}</p>`;
        document.getElementById('teleprompter').innerText = s.note;

        document.querySelectorAll('.sidebar-item').forEach(el => {
            el.classList.toggle('active', Number(el.dataset.index) === i);
        });

        document.getElementById('slide-counter').innerText = `${i + 1} / ${this.slides.length}`;
        document.getElementById('progress-fill').style.width = `${((i + 1) / this.slides.length) * 100}%`;

        const kpiGrid = document.getElementById('kpi-grid');
        kpiGrid.innerHTML = (s.kpis || []).map(([label, value]) =>
            `<div class="kpi-card"><div class="text-[10px] text-slate-400">${label}</div><div class="text-lg font-bold text-gold">${value}</div></div>`
        ).join('');
    },

    nextSlide() { this.loadSlide(Math.min(this.currentSlide + 1, this.slides.length - 1)); },
    prevSlide() { this.loadSlide(Math.max(this.currentSlide - 1, 0)); },

    toggleCinema() {
        document.getElementById('root').classList.toggle('cinema-mode');
        document.getElementById('sidebar').classList.toggle('hidden');
        document.getElementById('expert-panel').classList.toggle('hidden');
    },

    toggleDashboard() {
        this.dashboardCollapsed = !this.dashboardCollapsed;
        document.getElementById('root').classList.toggle('dashboard-collapsed', this.dashboardCollapsed);
        document.getElementById('expert-panel').classList.toggle('hidden', this.dashboardCollapsed);
    }
};

MatrixEngine.init();

// Prevent runtime mutation of slide data once the engine has booted
Object.freeze(MatrixEngine.slides);
</script>
</body>
</html>
